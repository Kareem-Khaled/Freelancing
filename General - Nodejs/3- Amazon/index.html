<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Amazon Egypt Scraper</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body>
  <div class="container py-4">
    <h1 class="mb-4">Amazon Egypt Scraper</h1>

    <!-- Add URLs -->
    <!-- <div class="mb-4">
      <label for="urls" class="form-label">Add URL(s)</label>
      <textarea id="urls" class="form-control" rows="4" placeholder="Enter multiple URLs, one per line"></textarea>
    </div> -->

    <!-- Category Checkboxes -->
    <div class="mb-4">
      <h4>Categories</h4>
      <div id="categoryContainer" class="ps-2"></div>
    </div>

    <div class="row g-3 mb-4">
      <div class="col-md-6">
        <label for="fetchThreads" class="form-label">Fetch Threads</label>
        <input type="number" class="form-control" id="fetchThreads" value="3" />
      </div>
      <div class="col-md-6">
        <label for="scrapeThreads" class="form-label">Scrape Threads</label>
        <input type="number" class="form-control" id="scrapeThreads" value="20" />
      </div>
      <!-- <div class="col-md-6">
        <label for="workers" class="form-label">Workers</label>
        <input type="number" class="form-control" id="workers" value="10" />
      </div>
      <div class="col-md-6">
        <label for="bufferLimit" class="form-label">Buffer Limit</label>
        <input type="number" class="form-control" id="bufferLimit" value="1000" />
      </div> -->
    </div>

    <!-- Action Buttons -->
    <div class="mb-4">
      <button id="scrapeBtn" class="btn btn-success me-2">Start Scraping</button>
    </div>

    <!-- Status -->
    <div id="status" class="mb-3 text-muted"></div>
  </div>

  <!-- Scraping Timer -->
  <div class="container mb-4">
    <div class="d-flex align-items-center gap-2">
      <strong>Scraping Time:</strong>
      <div id="scraping-timer" class="fw-bold">00:00:00</div>
    </div>
  </div>

  <!-- Link to external JavaScript file -->
  <script src="renderer.js"></script>
</body>
</html>
